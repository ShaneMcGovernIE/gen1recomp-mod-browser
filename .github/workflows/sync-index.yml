name: Sync Mod Index from Upstream

on:
  schedule:
    # Run every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest mod index and update dataset
        run: python3 scripts/sync_upstream_index.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/github_mods.js
          if git diff --staged --quiet; then
            echo "No changes in mod index dataset."
          else
            git commit -m "Auto-sync mod index from upstream"
            git push origin main
          fi
